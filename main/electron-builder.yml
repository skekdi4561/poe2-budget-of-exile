publish:
  - "github"
appId: "com.skekdi4561.poe2-sise"
# 신형 서명 툴셋: 플랫폼별 zip 이라 legacy 아카이브의 darwin 심볼릭 링크 문제
# (Windows 에서 추출 실패 → rcedit 가 exe 를 반쯤 스탬핑해 즉사 바이너리 생성)가 없다
toolsets:
  winCodeSign: "1.1.0"
# 표시 이름(설치 화면·시작 메뉴·트레이). 값이 하나뿐이라 지역화가 안 되므로 영어 정본을 쓴다 —
# 한국어 이름 "PoE2 시세 감정소" 는 앱 안 UI(app_i18n 의 app.name)가 담당한다.
# ⚠️ appId 는 일부러 안 바꿨다: NSIS 업그레이드가 그 값으로 기존 설치를 찾는데, 바꾸면
# 기존 사용자에게 갈아끼우기가 아니라 **두 번째 설치**가 생긴다.
productName: "PoE2 Budget of Exile"
npmRebuild: false
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
# 원저작권 고지(MIT "shall be included in all copies") — 설치 폴더 resources/LICENSE.txt
extraResources:
  - from: "../LICENSE"
    to: "LICENSE.txt"
# signAndEditExecutable 을 끈 대신 여기서 rcedit 로 아이콘·버전 정보를 찍는다(아래 win 주석 참고)
afterPack: "build/afterPack.js"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "PoE2-BudgetOfExile-Setup-${version}.${ext}"
# 포터블은 배포하지 않는다(2026-09-06 사용자 결정) — 만들어두면 릴리스에 실수로 섞인다.
# 설치본을 안 건드리고 새 빌드를 확인하고 싶으면 dist/win-unpacked 를 직접 실행하면 된다.
win:
  # 기본 조회 경로는 build/icon.ico 인데 이 포크의 아이콘은 build/icons/icon.ico 에 있어
  # 못 찾고 업스트림 PNG 세트로 떨어졌다 — 그래서 사용자가 내려받는 Setup exe 가
  # **원작 아이콘**을 달고 나갔다(설치 뒤 앱 exe 만 afterPack 이 우리 아이콘으로 스탬핑).
  icon: "build/icons/icon.ico"
  # winCodeSign(legacy 7z)의 darwin 심볼릭 링크가 Windows 추출에서 실패해 rcedit 가
  # exe 를 반쯤 스탬핑하다 즉사 바이너리를 만든다 — 편집 단계를 끄고 build/afterPack.js 가
  # rcedit(npm 패키지 동봉 바이너리)로 아이콘·ProductName 을 찍는다. 안 찍으면 바탕화면 바로가기와
  # 작업 관리자에 Electron 기본 아이콘·"Electron / GitHub, Inc." 가 그대로 노출된다(배포 점검에서 확인).
  signAndEditExecutable: false
  target:
    - "nsis"
linux:
  target:
    - "AppImage"
mac:
  target:
    - target: "dmg"
      arch:
        - "universal"
  identity: null
  x64ArchFiles: "*"
appImage:
  executableArgs:
    - "--sandbox"
